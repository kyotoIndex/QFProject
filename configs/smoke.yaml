project:
  name: quantum_finance_smoke
  seed: 42
  output_dir: outputs

data:
  symbols:
    - AAPL
  start_date: "2022-01-01"
  end_date: "2024-12-31"
  interval: 1d
  cache_dir: data_cache

features:
  lookback: 8
  horizon: 1
  volatility_window: 20
  momentum_window: 10
  bollinger_window: 20
  rsi_window: 14
  train_ratio: 0.7
  val_ratio: 0.15

quantum:
  encoding: qaoa_feature_map
  ansatz: hardware_efficient
  n_qubits: 3
  n_layers: 1
  n_reuploads: 2
  temperature: 1.0
  states:
    - bullish_low_vol
    - bullish_high_vol
    - neutral
    - bearish_low_vol
    - bearish_high_vol

model:
  type: vqc
  dropout: 0.0
  readout_hidden_size: 16
  recurrent_type: gru
  hidden_size: 32
  num_layers: 1
  input_projection_size: 32
  mlp_hidden_size: 32

training:
  batch_size: 32
  epochs: 2
  learning_rate: 0.01
  weight_decay: 0.0
  early_stopping_patience: 2
  gradient_clip_norm: 1.0
  loss_weights:
    regression: 1.0
    direction: 1.0
    risk: 1.0

strategy:
  buy_threshold: 0.002
  sell_threshold: -0.002
  high_risk_class: 2
